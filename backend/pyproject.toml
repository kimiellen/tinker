[project]
name = "tinker"
version = "0.1.0"
description = "英文歌学唱应用：内录、逐句学习"
requires-python = ">=3.11"
dependencies = [
    "cmudict>=1.1.3",
    "demucs>=4.1,<5",
    "fastapi>=0.115",
    "faster-whisper>=1.2.1",
    # demucs 的音频读写用 numpy，但它的依赖声明只在 macOS 分支写了 numpy，
    # Linux 上必须显式声明，否则运行时报 No module named 'numpy'
    "numpy>=2.0",
    "torch>=2.1",
    "torchaudio>=2.1",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["."]

# 本机是无 GPU 的 Arch 单机：torch 只装 CPU 轮子（约 200MB），
# 默认 PyPI 的 torch 会带 CUDA 依赖（2GB+）且运行不了。
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

# 只在 Linux 上运行（spec 明确单平台）；不加这行 uv 会按 macOS 的依赖标记
# 求解，demucs 在 macOS 要求 numpy<2，与本项目的 numpy>=2 冲突导致锁不出结果。
[tool.uv]
environments = ["sys_platform == 'linux'"]
