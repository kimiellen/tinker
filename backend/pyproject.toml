[project]
name = "tinker"
version = "0.1.0"
description = "英文歌学唱应用：内录、逐句学习、跟唱评估"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
