[project]
name = "tinker"
version = "0.1.0"
description = "英文歌学唱应用：内录、逐句学习"
requires-python = ">=3.11"
dependencies = [
    "cmudict>=1.1.3",
    "fastapi>=0.115",
    "faster-whisper>=1.2.1",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
